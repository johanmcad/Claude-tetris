<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <title>Tetris Game</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Courier New', monospace;
            background: radial-gradient(ellipse at center, #0a0e27 0%, #000000 100%);
            background-attachment: fixed;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
            -webkit-user-select: none;
            user-select: none;
            position: relative;
            overflow-x: hidden;
        }

        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background:
                linear-gradient(0deg, transparent 24%, rgba(0, 242, 254, 0.05) 25%, rgba(0, 242, 254, 0.05) 26%, transparent 27%, transparent 74%, rgba(0, 242, 254, 0.05) 75%, rgba(0, 242, 254, 0.05) 76%, transparent 77%, transparent),
                linear-gradient(90deg, transparent 24%, rgba(0, 242, 254, 0.05) 25%, rgba(0, 242, 254, 0.05) 26%, transparent 27%, transparent 74%, rgba(0, 242, 254, 0.05) 75%, rgba(0, 242, 254, 0.05) 76%, transparent 77%, transparent);
            background-size: 50px 50px;
            pointer-events: none;
            z-index: 0;
        }

        .game-container {
            background: rgba(5, 10, 20, 0.85);
            border-radius: 15px;
            padding: 30px;
            box-shadow: 0 0 60px rgba(0, 242, 254, 0.4),
                        0 0 100px rgba(255, 16, 240, 0.2),
                        inset 0 0 80px rgba(0, 242, 254, 0.05);
            border: 2px solid rgba(0, 242, 254, 0.5);
            display: flex;
            gap: 30px;
            position: relative;
            z-index: 1;
        }

        .game-area {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        h1 {
            color: #00f2fe;
            margin-bottom: 20px;
            text-align: center;
            font-size: 2.5em;
            font-weight: bold;
            letter-spacing: 8px;
            text-shadow:
                0 0 10px #00f2fe,
                0 0 20px #00f2fe,
                0 0 30px #00f2fe,
                0 0 40px #00a8ff,
                0 0 70px #00a8ff,
                0 0 80px #00a8ff;
            animation: glow 2s ease-in-out infinite alternate;
        }

        @keyframes glow {
            from {
                text-shadow:
                    0 0 10px #00f2fe,
                    0 0 20px #00f2fe,
                    0 0 30px #00f2fe,
                    0 0 40px #00a8ff;
            }
            to {
                text-shadow:
                    0 0 20px #00f2fe,
                    0 0 30px #00f2fe,
                    0 0 40px #00f2fe,
                    0 0 50px #00a8ff,
                    0 0 70px #00a8ff;
            }
        }

        #gameCanvas {
            border: 3px solid #00f2fe;
            border-radius: 8px;
            background: #000;
            box-shadow:
                0 0 20px rgba(0, 242, 254, 0.6),
                0 0 40px rgba(0, 242, 254, 0.4),
                inset 0 0 60px rgba(0, 242, 254, 0.1);
            touch-action: none;
        }

        .sidebar {
            display: flex;
            flex-direction: column;
            gap: 20px;
            min-width: 200px;
        }

        .info-box {
            background: rgba(0, 10, 20, 0.6);
            color: #00f2fe;
            padding: 20px;
            border-radius: 10px;
            border: 2px solid rgba(0, 242, 254, 0.5);
            box-shadow:
                0 0 20px rgba(0, 242, 254, 0.3),
                inset 0 0 20px rgba(0, 242, 254, 0.05);
        }

        .info-box h2 {
            margin-bottom: 10px;
            font-size: 1.2em;
            border-bottom: 2px solid rgba(0, 242, 254, 0.5);
            padding-bottom: 8px;
            text-shadow: 0 0 10px #00f2fe;
            letter-spacing: 2px;
        }

        .info-box p {
            font-size: 2em;
            font-weight: bold;
            margin-top: 10px;
            color: #ff10f0;
            text-shadow:
                0 0 10px #ff10f0,
                0 0 20px #ff10f0;
        }

        #nextPieceCanvas {
            background: rgba(0, 0, 0, 0.6);
            border-radius: 5px;
            margin-top: 10px;
            display: block;
            margin-left: auto;
            margin-right: auto;
            border: 1px solid rgba(0, 242, 254, 0.3);
            box-shadow: 0 0 10px rgba(0, 242, 254, 0.2);
        }

        .controls {
            background: rgba(0, 10, 20, 0.6);
            padding: 20px;
            border-radius: 10px;
            border: 2px solid rgba(0, 242, 254, 0.3);
            box-shadow:
                0 0 15px rgba(0, 242, 254, 0.2),
                inset 0 0 15px rgba(0, 242, 254, 0.05);
        }

        .controls h2 {
            color: #00f2fe;
            margin-bottom: 15px;
            font-size: 1.2em;
            text-shadow: 0 0 10px #00f2fe;
            letter-spacing: 2px;
        }

        .controls ul {
            list-style: none;
        }

        .controls li {
            padding: 8px 0;
            color: #6dd5ed;
            font-size: 0.9em;
        }

        .controls strong {
            color: #ff10f0;
            display: inline-block;
            min-width: 100px;
            text-shadow: 0 0 5px #ff10f0;
        }

        button {
            width: 100%;
            padding: 15px;
            font-size: 1.1em;
            font-weight: bold;
            font-family: 'Courier New', monospace;
            letter-spacing: 2px;
            color: #00f2fe;
            background: rgba(0, 20, 40, 0.8);
            border: 2px solid #00f2fe;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s;
            margin-top: 10px;
            box-shadow:
                0 0 20px rgba(0, 242, 254, 0.5),
                inset 0 0 20px rgba(0, 242, 254, 0.1);
            text-shadow: 0 0 10px #00f2fe;
        }

        button:hover {
            background: rgba(0, 242, 254, 0.2);
            box-shadow:
                0 0 30px rgba(0, 242, 254, 0.8),
                0 0 50px rgba(0, 242, 254, 0.5),
                inset 0 0 30px rgba(0, 242, 254, 0.2);
            transform: translateY(-2px);
        }

        button:active {
            transform: translateY(0);
            box-shadow:
                0 0 15px rgba(0, 242, 254, 0.6),
                inset 0 0 15px rgba(0, 242, 254, 0.15);
        }

        .game-over {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(5, 10, 20, 0.95);
            padding: 40px;
            border-radius: 15px;
            border: 3px solid #00f2fe;
            box-shadow:
                0 0 60px rgba(0, 242, 254, 0.8),
                0 0 100px rgba(255, 16, 240, 0.6),
                inset 0 0 60px rgba(0, 242, 254, 0.1);
            text-align: center;
            display: none;
            z-index: 1000;
        }

        .game-over.show {
            display: block;
        }

        .game-over h2 {
            color: #ff10f0;
            font-size: 2.5em;
            margin-bottom: 20px;
            text-shadow:
                0 0 20px #ff10f0,
                0 0 40px #ff10f0,
                0 0 60px #ff10f0;
            letter-spacing: 4px;
        }

        .game-over p {
            font-size: 1.5em;
            color: #00f2fe;
            margin-bottom: 30px;
            text-shadow: 0 0 10px #00f2fe;
        }

        .mobile-controls {
            display: none;
            margin-top: 20px;
            gap: 10px;
        }

        .mobile-controls-top {
            display: none;
            flex-direction: column;
            gap: 10px;
            margin-bottom: 15px;
            width: 100%;
        }

        .control-row {
            display: flex;
            gap: 10px;
            justify-content: center;
        }

        .control-btn {
            width: 70px;
            height: 70px;
            background: rgba(0, 20, 40, 0.8);
            border: 2px solid #ff10f0;
            border-radius: 12px;
            color: #ff10f0;
            font-size: 1.5em;
            font-weight: bold;
            cursor: pointer;
            box-shadow:
                0 0 20px rgba(255, 16, 240, 0.5),
                inset 0 0 20px rgba(255, 16, 240, 0.1);
            transition: all 0.2s;
            touch-action: manipulation;
            display: flex;
            align-items: center;
            justify-content: center;
            text-shadow: 0 0 10px #ff10f0;
        }

        .control-btn:active {
            transform: scale(0.95);
            background: rgba(255, 16, 240, 0.3);
            box-shadow:
                0 0 30px rgba(255, 16, 240, 0.8),
                inset 0 0 30px rgba(255, 16, 240, 0.2);
        }

        .control-btn.wide {
            width: 150px;
        }

        @media (max-width: 768px) {
            body {
                padding: 10px;
                align-items: flex-start;
                overflow-y: auto;
            }

            .game-container {
                flex-direction: column;
                padding: 15px;
                gap: 15px;
                width: 100%;
                max-width: 100%;
                margin: 20px auto;
            }

            .game-area {
                width: 100%;
            }

            h1 {
                font-size: 1.8em;
                margin-bottom: 15px;
            }

            #gameCanvas {
                width: 100%;
                max-width: 300px;
                height: auto;
            }

            .sidebar {
                width: 100%;
                min-width: 0;
            }

            .info-box {
                padding: 15px;
            }

            .info-box h2 {
                font-size: 1em;
            }

            .info-box p {
                font-size: 1.5em;
            }

            .controls {
                display: none;
            }

            .mobile-controls {
                display: flex;
                flex-direction: column;
            }

            .mobile-controls-top {
                display: flex;
            }

            .game-over {
                padding: 30px 20px;
                width: 90%;
                max-width: 400px;
            }

            .game-over h2 {
                font-size: 2em;
            }

            .game-over p {
                font-size: 1.2em;
            }
        }

        @media (max-width: 480px) {
            h1 {
                font-size: 1.5em;
            }

            .control-btn {
                width: 60px;
                height: 60px;
                font-size: 1.2em;
            }

            .control-btn.wide {
                width: 130px;
            }

            .info-box {
                padding: 12px;
            }

            .info-box h2 {
                font-size: 0.9em;
            }

            .info-box p {
                font-size: 1.3em;
            }
        }
    </style>
</head>
<body>
    <div class="game-container">
        <div class="game-area">
            <h1>TETRIS</h1>
            <div class="mobile-controls-top">
                <div class="control-row">
                    <button class="control-btn" id="btnRotateTop">↻</button>
                    <button class="control-btn wide" id="btnDropTop">DROP</button>
                </div>
                <div class="control-row">
                    <button class="control-btn" id="btnLeftTop">←</button>
                    <button class="control-btn" id="btnDownTop">↓</button>
                    <button class="control-btn" id="btnRightTop">→</button>
                </div>
            </div>
            <canvas id="gameCanvas" width="300" height="600"></canvas>
        </div>
        <div class="sidebar">
            <div class="info-box">
                <h2>Score</h2>
                <p id="score">0</p>
            </div>
            <div class="info-box">
                <h2>Level</h2>
                <p id="level">1</p>
            </div>
            <div class="info-box">
                <h2>Lines</h2>
                <p id="lines">0</p>
            </div>
            <div class="info-box">
                <h2>Next Piece</h2>
                <canvas id="nextPieceCanvas" width="120" height="120"></canvas>
            </div>
            <div class="controls">
                <h2>Controls</h2>
                <ul>
                    <li><strong>←/→</strong> Move</li>
                    <li><strong>↓</strong> Soft Drop</li>
                    <li><strong>↑</strong> Rotate</li>
                    <li><strong>Space</strong> Hard Drop</li>
                    <li><strong>P</strong> Pause</li>
                </ul>
            </div>
            <button id="startButton">Start Game</button>
            <div class="mobile-controls">
                <div class="control-row">
                    <button class="control-btn" id="btnRotate">↻</button>
                </div>
                <div class="control-row">
                    <button class="control-btn" id="btnLeft">←</button>
                    <button class="control-btn" id="btnDown">↓</button>
                    <button class="control-btn" id="btnRight">→</button>
                </div>
                <div class="control-row">
                    <button class="control-btn wide" id="btnDrop">DROP</button>
                </div>
            </div>
        </div>
    </div>

    <div class="game-over" id="gameOver">
        <h2>Game Over!</h2>
        <p>Final Score: <span id="finalScore">0</span></p>
        <button onclick="location.reload()">Play Again</button>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const nextCanvas = document.getElementById('nextPieceCanvas');
        const nextCtx = nextCanvas.getContext('2d');

        const COLS = 10;
        const ROWS = 20;
        const BLOCK_SIZE = 30;

        // Colors for each tetromino - Tron neon theme
        const COLORS = {
            'I': '#00f2fe',    // Neon cyan
            'O': '#fffc00',    // Neon yellow
            'T': '#ff10f0',    // Neon magenta
            'S': '#39ff14',    // Neon green
            'Z': '#ff073a',    // Neon red
            'J': '#0d6efd',    // Neon blue
            'L': '#ff8c00',    // Neon orange
            'empty': '#000000',
            'grid': '#00f2fe'  // Cyan grid lines
        };

        // Tetromino shapes
        const SHAPES = {
            'I': [[1, 1, 1, 1]],
            'O': [[1, 1], [1, 1]],
            'T': [[0, 1, 0], [1, 1, 1]],
            'S': [[0, 1, 1], [1, 1, 0]],
            'Z': [[1, 1, 0], [0, 1, 1]],
            'J': [[1, 0, 0], [1, 1, 1]],
            'L': [[0, 0, 1], [1, 1, 1]]
        };

        const SHAPE_NAMES = Object.keys(SHAPES);

        // Game state
        let board = [];
        let currentPiece = null;
        let nextPiece = null;
        let score = 0;
        let level = 1;
        let lines = 0;
        let gameRunning = false;
        let isPaused = false;
        let gameLoop = null;
        let dropCounter = 0;
        let dropInterval = 1000;
        let lastTime = 0;

        // Initialize the game board
        function initBoard() {
            board = Array(ROWS).fill().map(() => Array(COLS).fill(0));
        }

        // Create a new piece
        function createPiece(type) {
            const shapeName = type || SHAPE_NAMES[Math.floor(Math.random() * SHAPE_NAMES.length)];
            return {
                shape: SHAPES[shapeName].map(row => [...row]),
                color: shapeName,
                x: Math.floor(COLS / 2) - Math.floor(SHAPES[shapeName][0].length / 2),
                y: 0
            };
        }

        // Draw a block with Tron glow effect
        function drawBlock(ctx, x, y, color) {
            const px = x * BLOCK_SIZE;
            const py = y * BLOCK_SIZE;

            // Draw glowing border
            ctx.shadowBlur = 20;
            ctx.shadowColor = color;
            ctx.strokeStyle = color;
            ctx.lineWidth = 3;
            ctx.strokeRect(px, py, BLOCK_SIZE, BLOCK_SIZE);

            // Draw inner fill with gradient
            const gradient = ctx.createLinearGradient(px, py, px + BLOCK_SIZE, py + BLOCK_SIZE);
            gradient.addColorStop(0, color + '40');
            gradient.addColorStop(0.5, color + '20');
            gradient.addColorStop(1, color + '10');
            ctx.fillStyle = gradient;
            ctx.fillRect(px + 2, py + 2, BLOCK_SIZE - 4, BLOCK_SIZE - 4);

            // Draw bright inner border
            ctx.strokeStyle = color;
            ctx.lineWidth = 1;
            ctx.strokeRect(px + 3, py + 3, BLOCK_SIZE - 6, BLOCK_SIZE - 6);

            // Reset shadow
            ctx.shadowBlur = 0;
        }

        // Draw the board with Tron grid
        function drawBoard() {
            // Draw background
            ctx.fillStyle = COLORS.empty;
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Draw glowing grid
            ctx.strokeStyle = COLORS.grid;
            ctx.lineWidth = 0.5;
            ctx.shadowBlur = 5;
            ctx.shadowColor = COLORS.grid;
            ctx.globalAlpha = 0.3;

            for (let row = 0; row < ROWS; row++) {
                for (let col = 0; col < COLS; col++) {
                    ctx.strokeRect(col * BLOCK_SIZE, row * BLOCK_SIZE, BLOCK_SIZE, BLOCK_SIZE);
                }
            }

            ctx.globalAlpha = 1;
            ctx.shadowBlur = 0;

            // Draw placed pieces
            for (let row = 0; row < ROWS; row++) {
                for (let col = 0; col < COLS; col++) {
                    if (board[row][col]) {
                        drawBlock(ctx, col, row, COLORS[board[row][col]]);
                    }
                }
            }
        }

        // Draw the current piece
        function drawPiece(piece, context = ctx, offsetX = 0, offsetY = 0) {
            piece.shape.forEach((row, y) => {
                row.forEach((value, x) => {
                    if (value) {
                        drawBlock(context, piece.x + x + offsetX, piece.y + y + offsetY, COLORS[piece.color]);
                    }
                });
            });
        }

        // Draw the next piece preview
        function drawNextPiece() {
            nextCtx.fillStyle = COLORS.empty;
            nextCtx.fillRect(0, 0, nextCanvas.width, nextCanvas.height);

            if (nextPiece) {
                const offsetX = (4 - nextPiece.shape[0].length) / 2;
                const offsetY = (4 - nextPiece.shape.length) / 2;

                nextPiece.shape.forEach((row, y) => {
                    row.forEach((value, x) => {
                        if (value) {
                            drawBlock(nextCtx, x + offsetX, y + offsetY, COLORS[nextPiece.color]);
                        }
                    });
                });
            }
        }

        // Check collision
        function checkCollision(piece, offsetX = 0, offsetY = 0) {
            for (let y = 0; y < piece.shape.length; y++) {
                for (let x = 0; x < piece.shape[y].length; x++) {
                    if (piece.shape[y][x]) {
                        const newX = piece.x + x + offsetX;
                        const newY = piece.y + y + offsetY;

                        if (newX < 0 || newX >= COLS || newY >= ROWS) {
                            return true;
                        }

                        if (newY >= 0 && board[newY][newX]) {
                            return true;
                        }
                    }
                }
            }
            return false;
        }

        // Merge piece to board
        function mergePiece() {
            currentPiece.shape.forEach((row, y) => {
                row.forEach((value, x) => {
                    if (value) {
                        const boardY = currentPiece.y + y;
                        const boardX = currentPiece.x + x;
                        if (boardY >= 0) {
                            board[boardY][boardX] = currentPiece.color;
                        }
                    }
                });
            });
        }

        // Rotate piece
        function rotate(piece) {
            const rotated = piece.shape[0].map((_, i) =>
                piece.shape.map(row => row[i]).reverse()
            );
            return rotated;
        }

        // Move piece
        function movePiece(dir) {
            if (!gameRunning || isPaused) return;

            if (dir === 'left' && !checkCollision(currentPiece, -1, 0)) {
                currentPiece.x--;
            } else if (dir === 'right' && !checkCollision(currentPiece, 1, 0)) {
                currentPiece.x++;
            } else if (dir === 'down') {
                if (!checkCollision(currentPiece, 0, 1)) {
                    currentPiece.y++;
                    score += 1;
                    updateScore();
                } else {
                    lockPiece();
                }
            }
        }

        // Hard drop
        function hardDrop() {
            if (!gameRunning || isPaused) return;

            while (!checkCollision(currentPiece, 0, 1)) {
                currentPiece.y++;
                score += 2;
            }
            updateScore();
            lockPiece();
        }

        // Rotate current piece
        function rotatePiece() {
            if (!gameRunning || isPaused) return;

            const rotated = rotate(currentPiece);
            const previousShape = currentPiece.shape;
            currentPiece.shape = rotated;

            if (checkCollision(currentPiece, 0, 0)) {
                currentPiece.shape = previousShape;
            }
        }

        // Lock piece and check for lines
        function lockPiece() {
            mergePiece();
            clearLines();
            spawnNewPiece();

            if (checkCollision(currentPiece, 0, 0)) {
                gameOver();
            }
        }

        // Clear completed lines
        function clearLines() {
            let linesCleared = 0;

            for (let row = ROWS - 1; row >= 0; row--) {
                if (board[row].every(cell => cell !== 0)) {
                    board.splice(row, 1);
                    board.unshift(Array(COLS).fill(0));
                    linesCleared++;
                    row++;
                }
            }

            if (linesCleared > 0) {
                lines += linesCleared;
                score += [0, 100, 300, 500, 800][linesCleared] * level;

                level = Math.floor(lines / 10) + 1;
                dropInterval = Math.max(100, 1000 - (level - 1) * 100);

                updateScore();
            }
        }

        // Spawn new piece
        function spawnNewPiece() {
            currentPiece = nextPiece || createPiece();
            nextPiece = createPiece();
            drawNextPiece();
        }

        // Update score display
        function updateScore() {
            document.getElementById('score').textContent = score;
            document.getElementById('level').textContent = level;
            document.getElementById('lines').textContent = lines;
        }

        // Game over
        function gameOver() {
            gameRunning = false;
            document.getElementById('finalScore').textContent = score;
            document.getElementById('gameOver').classList.add('show');
        }

        // Update game
        function update(time = 0) {
            if (!gameRunning || isPaused) return;

            const deltaTime = time - lastTime;
            lastTime = time;
            dropCounter += deltaTime;

            if (dropCounter > dropInterval) {
                movePiece('down');
                dropCounter = 0;
            }

            draw();
            gameLoop = requestAnimationFrame(update);
        }

        // Draw everything
        function draw() {
            drawBoard();
            drawPiece(currentPiece);
        }

        // Start game
        function startGame() {
            initBoard();
            score = 0;
            level = 1;
            lines = 0;
            dropCounter = 0;
            dropInterval = 1000;
            gameRunning = true;
            isPaused = false;

            nextPiece = createPiece();
            spawnNewPiece();
            updateScore();

            document.getElementById('gameOver').classList.remove('show');
            document.getElementById('startButton').textContent = 'Restart';

            lastTime = performance.now();
            gameLoop = requestAnimationFrame(update);
        }

        // Toggle pause
        function togglePause() {
            if (!gameRunning) return;

            isPaused = !isPaused;
            if (!isPaused) {
                lastTime = performance.now();
                gameLoop = requestAnimationFrame(update);
            }
        }

        // Keyboard controls
        document.addEventListener('keydown', (e) => {
            if (!gameRunning) return;

            switch(e.key) {
                case 'ArrowLeft':
                    e.preventDefault();
                    movePiece('left');
                    break;
                case 'ArrowRight':
                    e.preventDefault();
                    movePiece('right');
                    break;
                case 'ArrowDown':
                    e.preventDefault();
                    movePiece('down');
                    break;
                case 'ArrowUp':
                    e.preventDefault();
                    rotatePiece();
                    break;
                case ' ':
                    e.preventDefault();
                    hardDrop();
                    break;
                case 'p':
                case 'P':
                    e.preventDefault();
                    togglePause();
                    break;
            }
            draw();
        });

        // Start button
        document.getElementById('startButton').addEventListener('click', startGame);

        // Mobile control buttons
        document.getElementById('btnLeft').addEventListener('click', (e) => {
            e.preventDefault();
            movePiece('left');
            draw();
        });

        document.getElementById('btnRight').addEventListener('click', (e) => {
            e.preventDefault();
            movePiece('right');
            draw();
        });

        document.getElementById('btnDown').addEventListener('click', (e) => {
            e.preventDefault();
            movePiece('down');
            draw();
        });

        document.getElementById('btnRotate').addEventListener('click', (e) => {
            e.preventDefault();
            rotatePiece();
            draw();
        });

        document.getElementById('btnDrop').addEventListener('click', (e) => {
            e.preventDefault();
            hardDrop();
            draw();
        });

        // Mobile control buttons (top)
        document.getElementById('btnLeftTop').addEventListener('click', (e) => {
            e.preventDefault();
            movePiece('left');
            draw();
        });

        document.getElementById('btnRightTop').addEventListener('click', (e) => {
            e.preventDefault();
            movePiece('right');
            draw();
        });

        document.getElementById('btnDownTop').addEventListener('click', (e) => {
            e.preventDefault();
            movePiece('down');
            draw();
        });

        document.getElementById('btnRotateTop').addEventListener('click', (e) => {
            e.preventDefault();
            rotatePiece();
            draw();
        });

        document.getElementById('btnDropTop').addEventListener('click', (e) => {
            e.preventDefault();
            hardDrop();
            draw();
        });

        // Touch swipe controls on canvas
        let touchStartX = 0;
        let touchStartY = 0;
        let touchEndX = 0;
        let touchEndY = 0;

        canvas.addEventListener('touchstart', (e) => {
            e.preventDefault();
            touchStartX = e.changedTouches[0].screenX;
            touchStartY = e.changedTouches[0].screenY;
        }, { passive: false });

        canvas.addEventListener('touchend', (e) => {
            e.preventDefault();
            touchEndX = e.changedTouches[0].screenX;
            touchEndY = e.changedTouches[0].screenY;
            handleSwipe();
        }, { passive: false });

        function handleSwipe() {
            const deltaX = touchEndX - touchStartX;
            const deltaY = touchEndY - touchStartY;
            const minSwipeDistance = 30;

            if (Math.abs(deltaX) > Math.abs(deltaY)) {
                // Horizontal swipe
                if (Math.abs(deltaX) > minSwipeDistance) {
                    if (deltaX > 0) {
                        movePiece('right');
                    } else {
                        movePiece('left');
                    }
                }
            } else {
                // Vertical swipe
                if (Math.abs(deltaY) > minSwipeDistance) {
                    if (deltaY > 0) {
                        movePiece('down');
                    } else {
                        rotatePiece();
                    }
                }
            }
            draw();
        }

        // Initial draw
        drawBoard();
        drawNextPiece();
    </script>
</body>
</html>
